name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-apk:
    name: Build & Publish APKs
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Verify Android SDK
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          echo "Using Android SDK at $SDK_ROOT"
          test -d "$SDK_ROOT" || { echo "::error::Android SDK not found on the runner."; exit 1; }
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | head -n 1)"
          if [ -n "$SDKMANAGER" ]; then
            yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
            yes | "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" > /tmp/sdk-install.log 2>&1 || true
            tail -n 5 /tmp/sdk-install.log || true
          fi
          echo "Installed platforms:"; ls "$SDK_ROOT/platforms" 2>/dev/null || true
          echo "Installed build-tools:"; ls "$SDK_ROOT/build-tools" 2>/dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Ensure google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "Using google-services.json from the GOOGLE_SERVICES_JSON secret."
          elif [ -f android/app/google-services.json ]; then
            echo "Using the committed android/app/google-services.json."
          else
            echo "::error::android/app/google-services.json is missing. Commit it or set the GOOGLE_SERVICES_JSON repository secret."
            exit 1
          fi

      - name: Configure release signing
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$KEYSTORE_PASSWORD" ] && [ -n "$KEY_ALIAS" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
            {
              echo "storeFile=release.keystore"
              echo "storePassword=$KEYSTORE_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "keyPassword=$KEY_PASSWORD"
            } > android/keystore.properties
            echo "using_release_key=true" >> "$GITHUB_OUTPUT"
            echo "Release APK will be signed with the configured release keystore."
          else
            echo "::error::Missing release signing secrets (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). The release APK MUST be signed with the permanent key - a throwaway debug key changes on every run and Android then refuses to install it over the previous version."
            exit 1
          fi

      - name: Build debug and release APKs
        working-directory: ./android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../Net-CAR.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../Net-CAR-debug.apk
          cd ..
          sha256sum Net-CAR.apk Net-CAR-debug.apk > checksums.txt
          ls -lh Net-CAR.apk Net-CAR-debug.apk checksums.txt

      - name: Verify the release signing key
        # A release APK signed with a different key cannot be installed over
        # the previous version, so fail loudly instead of publishing it.
        run: |
          SDK_ROOT="${ANDROID_HOME:-$ANDROID_SDK_ROOT}"
          EXPECTED="$(echo '${{ vars.RELEASE_CERT_SHA256 }}' | tr -d ':' | tr 'A-F' 'a-f')"
          if [ -z "$EXPECTED" ]; then
            echo "::notice::RELEASE_CERT_SHA256 is not set - skipping the fingerprint check."
            exit 0
          fi
          BUILD_TOOLS=$(ls -d "$SDK_ROOT"/build-tools/* 2>/dev/null | sort -V | tail -1)
          echo "build-tools: $BUILD_TOOLS"
          ACTUAL=$("$BUILD_TOOLS/apksigner" verify --print-certs Net-CAR.apk 2>&1 \
            | grep -m1 'certificate SHA-256 digest' \
            | sed 's/.*digest: //' | tr -d ':' | tr 'A-F' 'a-f' || true)
          echo "expected: $EXPECTED"
          echo "actual:   $ACTUAL"
          if [ -z "$ACTUAL" ]; then
            echo "::error::Could not read the signature of Net-CAR.apk."
            exit 1
          fi
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "::error::The release APK is signed with a different key than RELEASE_CERT_SHA256. Android would refuse to install it over the previous version."
            exit 1
          fi
          echo "Release APK signature matches the permanent key."

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Net-CAR-Android-APK
          path: |
            Net-CAR.apk
            Net-CAR-debug.apk
            checksums.txt
          if-no-files-found: error
          retention-days: 30

      - name: Capture build metadata
        id: meta
        run: |
          echo "date=$(date -u +'%Y-%m-%d')" >> "$GITHUB_OUTPUT"
          echo "version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"

      - name: Publish versioned release (kept permanently)
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Net-CAR v1.0.${{ github.run_number }} — ${{ steps.meta.outputs.date }}
          body: |
            Automated Android build from commit `${{ github.sha }}` (workflow run #${{ github.run_number }}).

            - **Version:** `1.0.${{ github.run_number }}` (versionCode `${{ github.run_number }}`)
            - **Build date:** ${{ steps.meta.outputs.date }}
            - **Signing:** ${{ steps.signing.outputs.using_release_key == 'true' && 'release keystore' || 'CI debug key (uninstall the old app before updating)' }}

            | Asset | Description |
            |-------|-------------|
            | `Net-CAR.apk` | Release build (recommended) |
            | `Net-CAR-debug.apk` | Debug build (debuggable, for testing) |
            | `checksums.txt` | SHA-256 checksums for both APKs |

            Install on Android 8.0+ (API 26). If Android refuses to update an existing installation, uninstall the old app first.

            > This versioned release is kept permanently. Previous versions remain listed on the
            > [Releases page](https://github.com/${{ github.repository }}/releases), newest first.
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            Net-CAR.apk
            Net-CAR-debug.apk
            checksums.txt

      - name: Publish APKs to GitHub Release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest-apk
          name: Net-CAR Android APK (Latest Build)
          body: |
            Automated Android build from commit `${{ github.sha }}` (workflow run #${{ github.run_number }}).

            - **Version:** `1.0.${{ github.run_number }}` (versionCode `${{ github.run_number }}`)
            - **Build date:** ${{ steps.meta.outputs.date }}
            - **Signing:** ${{ steps.signing.outputs.using_release_key == 'true' && 'release keystore' || 'CI debug key (uninstall the old app before updating)' }}

            | Asset | Description |
            |-------|-------------|
            | `Net-CAR.apk` | Release build (recommended) |
            | `Net-CAR-debug.apk` | Debug build (debuggable, for testing) |
            | `checksums.txt` | SHA-256 checksums for both APKs |

            Install on Android 8.0+ (API 26). If Android refuses to update an existing installation, uninstall the old app first.

            **Older versions:** every build also gets its own permanent release tagged
            `v1.0.<run_number>` (see the [Releases page](https://github.com/${{ github.repository }}/releases)).
            Use those if the latest build has a problem while a fix is prepared.
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: |
            Net-CAR.apk
            Net-CAR-debug.apk
            checksums.txt
