name: Build & Deploy Web

# Builds the Next.js web app on every change and (optionally) deploys it to
# Vercel.
#
# The web app lives in the `web/` workspace of this monorepo, so the Vercel
# project must use:
#   Root directory .... web
#   Build command ..... npm run build
#   Install command ... npm install
#   Node version ...... 20
#
# Deploy from GitHub Actions (optional):
#   secrets VERCEL_TOKEN        -> API token (vercel.com/account/tokens)
#   secrets VERCEL_ORG_ID       -> team id (vercel.com/<team>/settings)
#   secrets VERCEL_PROJECT_ID   -> project id (the project's General settings)
#
# Without those secrets the workflow only builds the app, uploads the build
# artifact and verifies that the web still compiles.

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Vercel (skip for a build-only run)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-deploy:
    name: Build & deploy web app
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix web

      - name: Fetch the latest published APK
        # The web app serves the APK from /api/download-apk; grab the newest
        # release asset so the download button always works after a deploy.
        continue-on-error: true
        run: |
          mkdir -p web/public
          gh release download latest-apk --pattern 'Net-CAR.apk' --dir web/public --clobber \
            || echo "No published APK found yet, continuing without it."
          ls -la web/public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web app
        run: npm run build --prefix web
        env:
          NEXT_TELEMETRY_DISABLED: '1'

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_number }}
          path: |
            web/.next
            web/package.json
            web/next.config.ts
          retention-days: 14
          if-no-files-found: error

      - name: Check deploy configuration
        id: deploy
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "method=vercel" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No Vercel credentials configured - build only."
          fi
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel
        if: steps.deploy.outputs.method == 'vercel'
        working-directory: web
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Web build"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- deployed to Vercel: \`${{ steps.deploy.outputs.enabled }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
