name: Build & Deploy Web

# Builds the Next.js web app on every change and deploys it to Cloud Run.
#
# Required repository secrets (only needed for the deploy step):
#   GCP_SERVICE_ACCOUNT_KEY  -> service account JSON key with
#                               "Cloud Run Admin" + "Service Account User"
#                               on the target project.
#   (alternative) vars.GCP_WIF_PROVIDER + vars.GCP_WIF_SERVICE_ACCOUNT
#                               -> Workload Identity Federation (no key needed).
#
# Optional repository variables (defaults shown):
#   CLOUD_RUN_SERVICE   = netcar-web
#   CLOUD_RUN_REGION    = europe-west1
#   GCP_PROJECT_ID      = axiomatic-serenity-8lvvl

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'package.json'
      - 'package-lock.json'
      - 'server.js'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Deploy to Cloud Run (skip for a build-only run)'
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

concurrency:
  group: web-deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  build-and-deploy:
    name: Build & deploy web app
    runs-on: ubuntu-latest
    env:
      CLOUD_RUN_SERVICE: ${{ vars.CLOUD_RUN_SERVICE || 'netcar-web' }}
      CLOUD_RUN_REGION: ${{ vars.CLOUD_RUN_REGION || 'europe-west1' }}
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID || 'axiomatic-serenity-8lvvl' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fetch the latest published APK
        # The web app serves the APK from /api/download-apk; grab the newest
        # release asset so the download button always works after a deploy.
        continue-on-error: true
        run: |
          mkdir -p web/public
          gh release download latest-apk --pattern 'Net-CAR.apk' --dir web/public --clobber \
            || echo "No published APK found yet, continuing without it."
          ls -la web/public || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web app
        run: npm run build

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build-${{ github.run_number }}
          path: |
            .next
            server.js
            package.json
          retention-days: 14
          if-no-files-found: error

      - name: Check deploy configuration
        id: deploy
        run: |
          if [ -n "$GCP_SERVICE_ACCOUNT_KEY" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "method=key" >> "$GITHUB_OUTPUT"
          elif [ -n "$GCP_WIF_PROVIDER" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "method=wif" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "method=none" >> "$GITHUB_OUTPUT"
            echo "::notice::No Google Cloud credentials configured - build only."
          fi
        env:
          GCP_SERVICE_ACCOUNT_KEY: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}
          GCP_WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}

      - name: Authenticate with a service account key
        if: steps.deploy.outputs.method == 'key'
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY }}

      - name: Authenticate with Workload Identity Federation
        if: steps.deploy.outputs.method == 'wif'
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      - name: Deploy to Cloud Run
        if: steps.deploy.outputs.enabled == 'true'
        run: |
          gcloud run deploy "$CLOUD_RUN_SERVICE" \
            --source . \
            --region "$CLOUD_RUN_REGION" \
            --project "$GCP_PROJECT_ID" \
            --platform managed \
            --allow-unauthenticated \
            --port 3000 \
            --set-env-vars "NODE_ENV=production"
        env:
          CLOUD_RUN_SERVICE: ${{ env.CLOUD_RUN_SERVICE }}
          CLOUD_RUN_REGION: ${{ env.CLOUD_RUN_REGION }}
          GCP_PROJECT_ID: ${{ env.GCP_PROJECT_ID }}

      - name: Summary
        if: always()
        run: |
          {
            echo "### Web build"
            echo ""
            echo "- commit: \`${GITHUB_SHA}\`"
            echo "- service: \`${CLOUD_RUN_SERVICE}\` (${GCP_PROJECT_ID} / ${CLOUD_RUN_REGION})"
            echo "- deployed: \`${{ steps.deploy.outputs.enabled }}\`"
          } >> "$GITHUB_STEP_SUMMARY"
